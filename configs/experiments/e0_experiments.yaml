schema_version: 1
seeds: [42, 43, 44]
terrain_stages:
  foundation: {profile: union_foundation, iterations: 1000}
  expansion: {profile: union_expansion, iterations: 5000}
  composition: {profile: union_composition, iterations: 7000}
  consolidation: {profile: union_consolidation, iterations: 7000}

experiments:
  b0_t1_ppo:
    batch: B0
    config: configs/train/main/b0_t1_ppo.yaml
  b1_moe_core:
    batch: B1
    config: configs/train/main/b1_moe_core.yaml
  b2_moe_reflex:
    batch: B2-A
    config: configs/train/main/b2_moe_reflex.yaml
  b2_bisec_full:
    batch: B2-B
    config: configs/train/main/b2_bisec_full.yaml
  a3_minus_ent:
    batch: B3
    config: configs/train/auxiliary/a3_minus_ent.yaml
  a3_minus_ortho:
    batch: B3
    config: configs/train/auxiliary/a3_minus_ortho.yaml
  a3_minus_temp:
    batch: B3
    config: configs/train/auxiliary/a3_minus_temp.yaml
  a3_all_expert_ortho:
    batch: B3
    config: configs/train/auxiliary/a3_all_expert_ortho.yaml
  a4_ppo_total_capacity:
    batch: B3
    config: configs/train/auxiliary/a4_ppo_total_capacity.yaml
  a4_ppo_active_capacity:
    batch: B3
    config: configs/train/auxiliary/a4_ppo_active_capacity.yaml
  p0_no_privileged_t1:
    batch: B3
    config: configs/train/auxiliary/p0_no_privileged_t1.yaml
  p0_no_privileged_full:
    batch: B3
    config: configs/train/auxiliary/p0_no_privileged_full.yaml
  p1_history_t1:
    batch: B3
    config: configs/train/auxiliary/p1_history_t1.yaml
  p1_history_full:
    batch: B3
    config: configs/train/auxiliary/p1_history_full.yaml
  p2_terrain_t1:
    batch: B3
    config: configs/train/auxiliary/p2_terrain_t1.yaml
  p2_terrain_full:
    batch: B3
    config: configs/train/auxiliary/p2_terrain_full.yaml
  p3_history_terrain_t1:
    batch: B3
    config: configs/train/auxiliary/p3_history_terrain_t1.yaml
  p3_history_terrain_full:
    batch: B3
    config: configs/train/auxiliary/p3_history_terrain_full.yaml
  fixed_curriculum_t1:
    batch: B3
    config: configs/train/auxiliary/fixed_curriculum_t1.yaml
  fixed_curriculum_full:
    batch: B3
    config: configs/train/auxiliary/fixed_curriculum_full.yaml

regularizer_sweep:
  base_config: configs/train/main/b2_moe_reflex.yaml
  gate_entropy_coef: [0.0, 0.01, 0.03, 0.05]
  expert_orthogonality_coef: [0.0, 0.01, 0.03, 0.05]
  temporal_consistency_coef: [0.0, 0.01]

evaluation_profiles:
  main: union_consolidation
  deep_robotics_source_alignment: source_alignment
  legacy_zero_shot: legacy_equal
