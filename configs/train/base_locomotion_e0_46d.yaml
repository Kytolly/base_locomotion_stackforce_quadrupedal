schema_version: 2
# E0-v2-46d: leg actions follow the configured DS041MG travel (0.9 of 300 deg) and the
# new default stance; see docs/ACTION_RANGE_THROUGHPUT_FIX_PLAN.md (G4).
# E0-v1 checkpoints are evaluation-only and cannot resume under this contract.
protocol_version: E0-v2-46d
actor_observation_dim: 46
task: Base-Locomotion-Stackforce-Quadrupedal-Complex-v0

launcher:
  device: cuda:0
  viz: none
  enable_cameras: false
  max_visible_envs: 16
  use_fabric: true

env:
  num_envs: 4096
  seed: 42
  terrain_profile: union_foundation
  sim_dt: 0.005
  decimation: 4
  render_interval: 4
  episode_length_s: 30.0
  # servo_range_v2 (E0-v2) | legacy_symmetric (E0-v1 legs; G6 P0 control only).
  # The ranges, stance, body heights and obstacle caps come from
  # mdp/action/e0_v2_servo_contract.json (scripts/build_servo_contract.py).
  action_contract: servo_range_v2
  # Optional leg target slew limit per 20 ms control step (DS041MG one-step travel is
  # 8.73 rad/s x 0.02 s = 0.175 rad); the previous-action observation then carries the
  # limited command and a deployment must apply the same limit.  Off: adopt it only if
  # rollouts still show ineffective high-frequency commands and support, foothold and
  # disturbance recovery do not suffer.
  leg_target_max_step_rad: null
  # Actor joint channels the robot can compute: hip servo-model estimate (8.73 rad/s
  # rate-limited tracking of the command, finite-difference velocity) and commanded
  # wheel velocity; true hip state goes to the critic. docs/REAL_ROBOT_IO_SPEC.md.
  policy_joint_observation: servo_model
  servo_model_delay_steps: 0
  # T1: set per stage by scripts/e0_training_orchestrator.py; null = levels 0..1.
  terrain_init_level: null
  # G5 throughput switches. Values here are the E0-v1 behaviour except T3; change one
  # only after its G5 timing and physics check passed (output/fix_plan/G5/timing_matrix.json).
  # T3 must equal env/robots/stackforce.py SOLVER_POSITION_ITERATIONS (tested): 32 holds
  # the five-bar closures at velocity level (docs/OUTER_HIP_STATIC_FORCE_DIAGNOSIS.md).
  throughput:
    enabled_self_collisions: true      # T2
    solver_position_iteration_count: 32 # T3
    foot_track_pose: true              # T4
    foot_contact_update_period: null   # T6 (null = physics dt 0.005 s)
    replicate_physics: false           # T7
  physics:
    gpu_found_lost_aggregate_pairs_capacity: 67108864

# Reward-term overrides on top of env/complex_env_cfg.py RewardsCfg (scripts/rsl_rl/train.py
# applies them strictly).  Group B/E of docs/REWARD_CURRICULUM_FIX_PLAN.md: stronger action
# smoothing and joint-speed penalties, and a forward-tracking kernel that pays little for
# standing still (sigma 0.15 m/s instead of 0.25).
rewards:
  action_rate:
    weight: -0.05
  joint_velocity_limit:
    weight: -0.2
  track_forward_velocity:
    params:
      std: 0.15

curriculum:
  terrain_levels:
    params:
      tracking_rmse_range: [0.30, 0.18]
      yaw_rmse_range: [0.35, 0.20]
      progress_ratio_range: [0.60, 0.80]
      demotion_progress_ratio: 0.25
  motion_family:
    params:
      success_tracking_rmse: 0.30
      success_yaw_rmse: 0.35
      sampling_floor: 0.05
  robustness_bin:
    params:
      nominal_level: 0
      moderate_level: 2
      stress_level: 5

agent:
  num_steps_per_env: 24
  max_iterations: 1000
  save_interval: 250
  experiment_name: base_locomotion_e0_v2_46d
  run_name: e0_v2_46d_seed42
  clip_actions: 1.0
  resume: false
  load_run: null
  load_checkpoint: null
  actor:
    hidden_dims: [128, 128]
    activation: elu
    # Running mean/std normalization: without it the 0.1-0.45 command channels are
    # swamped by +-20 rad/s wheel and +-8.7 rad/s joint-velocity channels and the policy
    # ignores the command (docs/REWARD_CURRICULUM_FIX_PLAN.md, group G).  The statistics
    # are saved with the actor and folded into JIT/ONNX exports.
    obs_normalization: true
    distribution_cfg:
      class_name: base_locomotion_stackforce_quadrupedal.training.distribution:SquashedGaussianDistribution
      # Per dimension: 8 legs (outer FR FL RL RR, inner FR FL RL RR), then 4 wheels.
      # Leg values = 0.10 rad / larger half-range of each joint, so the initial
      # physical joint noise is <= 0.10 rad on both sides of the stance (one-step
      # servo travel is 0.175 rad); wheels 0.1 (2 rad/s, about 0.066 m/s of wheel speed;
      # 0.3 gave 0.2 m/s and random yaw). min_std 0.02 admits these.
      # Regenerate with servo_range.leg_init_std() whenever the contract changes.
      init_std: [0.043, 0.033, 0.0424, 0.0351, 0.0661, 0.0391, 0.0661, 0.0429, 0.1, 0.1, 0.1, 0.1]
      std_type: log
      min_std: 0.02
      max_std: 0.5
  critic:
    hidden_dims: [128, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    entropy_coef: 0.001
    desired_kl: 0.01
    max_grad_norm: 1.0
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2

wandb:
  enabled: true
  project: stackforce-quadrupedal-locomotion
  entity: null
  mode: online
  group: e0v2-46d
  run_name: ${agent.run_name}
  tags: [stackforce, quadrupedal, wheel-leg, e0, e0-v2, 46d]

video:
  enabled: false
  interval: 2000
  length: 200

runtime:
  log_root: logs/rsl_rl
  init_at_random_episode_length: true
  allow_terrain_stage_resume: false

logging:
  metrics:
    enabled: true
    groups:
      core: true
      safety: true
      runtime: true
      command: true
      support: true
      actuation: true
      terrain: true
      motion: true
      reward: true
  wandb_panels:
    enabled: true
    groups:
      core: true
      safety: true
      runtime: true
      command: true
      support: true
      actuation: true
      terrain: true
      motion: true
      reward: true
